# XcodeGen project for the IRIS iOS shell (AC-1/AC-15).
# Regenerate with: xcodegen generate (macOS CI/runner only).
# App product: in.iris.mesh; Swift 5 language mode (DEC-IOS-0002).

name: IRIS
options:
  bundleIdPrefix: in.iris.mesh
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
  configs:
    Debug:
      CODE_SIGNING_ALLOWED: "NO"
    Release:
      CODE_SIGNING_ALLOWED: "NO"
targets:
  IRIS:
    type: application
    platform: iOS
    sources:
      - path: IRIS
    info:
      path: IRIS/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.iris.mesh
        SWIFT_VERSION: "5.0"
        ENABLE_TESTABILITY: YES
  IRISTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: IRIS
  IRISTestsMacOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.iris.mesh.tests-host
        OTHER_LDFLAGS: $(inherited) ios/Build/macos/libIrisCore.a
    dependencies:
      - target: IRIS
  IrisLiveActivityWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.iris.mesh.liveactivity
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
schemes:
  IRIS:
    build:
      targets:
        IRIS: all
        IRISTests: [test]
    test:
      targets:
        - IRISTests
  IRIS-MacOSTests:
    build:
      targets:
        IRISTestsMacOS: [test]
    test:
      targets:
        - IRISTestsMacOS