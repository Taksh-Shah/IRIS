# IRIS Cargo Workspace
# Phase: CORE_PROTOCOL_IMPLEMENTATION (authorized 2026-08-12, Option A)
# ADR-0003: Rust core implementation

[workspace]
resolver = "2"
members = ["crates/iris-core", "crates/iris-storage", "crates/iris-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/iris/mesh"

[workspace.dependencies]
async-trait = "0.1"
blake3 = "1"
ciborium = "0.2"
chacha20poly1305 = "0.10.1"
curve25519-dalek = "4.1.3"
ed25519-dalek = "2"
futures-util = "0.3"
hex = "0.4"
hex-literal = "0.4"
hkdf = "0.12"
proptest = "1"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
x25519-dalek = "2.0.1"
zeroize = "1"
tempfile = "3"

[profile.release]
lto = true
