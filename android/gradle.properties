# Gradle daemon tuning + Android build flags (ANDROID-001 AC-6).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# Kotlin style
kotlin.code.style=official

# Compose strong-skipping is DEFAULT-ON since Compose 1.6 (BOM 2024.06.00+).
# This permission is explicit intent documentation for AC-6 ("strong-skipping on").
androidx.compose.runtime.enableStrongSkippingMode=true