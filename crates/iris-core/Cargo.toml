[package]
name = "iris-core"
description = "IRIS resilient communication fabric — core protocol engine (ADR-0003)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
proptest = ["dep:proptest"]
# Expose in-memory test doubles (SimulatedBleAdapter, StubTransport) in builds
# that are not #[cfg(test)] — e.g. integration test crates that need them
# across crate boundaries. Never enable in a production binary (SYS-6).
test-support = []

[dependencies]
async-trait.workspace = true
blake3.workspace = true
chacha20poly1305.workspace = true
ciborium.workspace = true
curve25519-dalek.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core", "zeroize"] }
futures-util.workspace = true
hex.workspace = true
hkdf.workspace = true
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true
serde_bytes.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# HV-86: the transport-event ring is a `tracing` Layer (see observability::ring).
tracing-subscriber.workspace = true
uuid.workspace = true
x25519-dalek = { workspace = true, features = ["static_secrets", "zeroize"] }
zeroize.workspace = true
proptest = { version = "1", optional = true }

[dev-dependencies]
hex-literal.workspace = true
tempfile.workspace = true
criterion.workspace = true
loom.workspace = true
tokio-test.workspace = true

# AC-4 loom leaf models: an empty crate unless built with --cfg loom.
# Invocation (verify-loom.sh): cargo rustc -p iris-core --test loom_models -- --cfg loom
# then run the built binary. NOTE: do NOT use global RUSTFLAGS="--cfg loom" —
# tokio's `net` module is #![cfg(not(loom))] and a global cfg breaks the lib.
[[test]]
name = "loom_models"
path = "loom/loom_models.rs"

# AC-10 criterion benches (DEC-TEST-0011): harness = false, CPU-path only.
[[bench]]
name = "codec"
harness = false

[[bench]]
name = "envelope"
harness = false

[[bench]]
name = "crypto"
harness = false

[[bench]]
name = "routing"
harness = false

[[bench]]
name = "fragment"
harness = false

# PRY-13: concurrency benchmark — N tasks hammering one node's security seam.
[[bench]]
name = "security_contention"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(loom)'] }

[lints.clippy]
# SYS-4: make every intentional error-discard explicit and distinguishable
# from an accidental one — use `.ok()` or a typed binding instead.
let_underscore_must_use = "warn"
