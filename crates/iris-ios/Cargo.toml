[package]
name = "iris-ios"
description = "IRIS resilient communication fabric — iOS integration layer (IOS-001, UniFFI binding)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The lib name fixes the UniFFI namespace/module: "IrisCore" -> generated
# `IrisCore.swift` + `IrisCoreFFI.h` under ios/IRIS/RustFFI/ (IOS_DESIGN.md §3).
[lib]
name = "IrisCore"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
iris-core = { path = "../iris-core" }
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uniffi.workspace = true

[build-dependencies]
uniffi_bindgen.workspace = true

[dev-dependencies]
tempfile.workspace = true