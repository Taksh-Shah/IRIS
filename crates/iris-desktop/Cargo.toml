[package]
name = "iris-desktop"
description = "IRIS resilient communication fabric — desktop shell (DESKTOP-001, Tauri v2)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "iris_desktop"

[features]
# Gates dev-seam builder methods (with_node_id / with_transport) that use
# DevCryptoProvider (fake crypto). These must never be reachable from a
# production build — enable only for integration tests via --features test-seams.
test-seams = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
rand.workspace = true
futures-util.workspace = true
iris-core = { path = "../iris-core" }
iris-storage = { path = "../iris-storage" }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio.workspace = true
futures-util.workspace = true
tempfile.workspace = true
