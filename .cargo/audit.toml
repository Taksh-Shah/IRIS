# cargo-audit configuration for the IRIS workspace (TEST-001, DEC-TEST-0002).
# Gate: `cargo audit --deny warnings` must exit 0 (see .github/workflows/ci.yml
# `audit` job). 0 vulnerabilities (574 deps, verified 2026-08-18); the
# informational (unmaintained/unsound) entries below are suppressed with an
# explicit reason + expiry so the recurring gate re-validates them on a
# schedule. Any NEW advisory still fails the gate.
# NOTE: cargo-audit 0.22.2 `ignore` accepts only advisory-ID strings; the
# reason + expiry for each suppression are the machine-checked-by-code-review
# contract above its entry. The CI-recurring re-review date is 2026-12-31.

[advisories]
ignore = [
  # ---- Desktop/tray UI-transitive advisories (iris-desktop Tauri v2 shell) ----
  # Reason: gtk-rs GTK3 binding family (atk/gdk/gtk/glib) is a Tauri v2 / tao /
  #         wry transitive dependency of iris-desktop only; NOT reachable from
  #         iris-core (no gtk/glib import in the mesh runtime). These crates are
  #         unmaintained upstream but pinned by Tauri's stable shell ABI; the
  #         desktop UI is a thin local shell, not an attack surface for mesh
  #         traffic. Re-review each expiry: if Tauri has moved to a maintained
  #         GTK4/relm tree, drop these suppressions and upgrade.
  # Expiry: 2026-12-31
  "RUSTSEC-2024-0412",   # gdk unmaintained
  "RUSTSEC-2024-0413",   # atk unmaintained
  "RUSTSEC-2024-0414",   # gdkx11-sys unmaintained
  "RUSTSEC-2024-0415",   # gtk unmaintained
  "RUSTSEC-2024-0416",   # atk-sys unmaintained
  "RUSTSEC-2024-0417",   # gdkx11 unmaintained
  "RUSTSEC-2024-0418",   # gdk-sys unmaintained
  "RUSTSEC-2024-0419",   # gtk3-macros unmaintained
  "RUSTSEC-2024-0420",   # gtk-sys unmaintained
  "RUSTSEC-2024-0411",   # gdkwayland-sys unmaintained
  "RUSTSEC-2024-0429",   # glib unsound (VariantStrIter Iterator/DoubleEndedIterator)
  # ---- Build-tooling transitive ----
  # Reason: proc-macro-error is a transitive build-time dependency of the
  #         syn/syn2/quote proc-macro ecosystem (unmaintained upstream); no
  #         runtime reachability. Re-review 2026-12-31.
  "RUSTSEC-2024-0370",   # proc-macro-error unmaintained
  # ---- unic-* unicode tables (unmaintained upstream) ----
  # Reason: unic-ucd-* / unic-common / unic-char-* are transitive unicode-table
  #         data crates (unicode-ident family) used by macro/parser tooling;
  #         no runtime reachability in iris-core. Re-review 2026-12-31.
  "RUSTSEC-2025-0081",   # unic-char-property unmaintained
  "RUSTSEC-2025-0075",   # unic-char-range unmaintained
  "RUSTSEC-2025-0080",   # unic-common unmaintained
  "RUSTSEC-2025-0100",   # unic-ucd-ident unmaintained
  "RUSTSEC-2025-0098",   # unic-ucd-version unmaintained
]