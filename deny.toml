# cargo-deny policy for the IRIS workspace (TEST-001, DEC-TEST-0002).
# Committed gate: advisories/bans/licenses/sources all FAIL on violation.
# Multi-version skips are curated for benign transitive splits; any NEW
# duplicate version in a skipped crate fails the gate (deny still applies to
# the family, only the listed version pair is waived).

version = 2

[advisories]
# Local advisory DB (mirror of https://github.com/RustSec/advisory-db).
db-path = "~/.cargo/advisory-db"
# A security vulnerability is a hard FAIL.
vulnerability = "deny"
# Unmaintained crates and yanked versions FAIL (supply-chain hygiene).
unmaintained = "deny"
yanked = "deny"
# Notice-level advisories are informational; do not fail the gate.
notice = "warn"
# No silent suppressions: every entry needs id + reason + expiry.
ignore = []
ignore-with-reason = []

[bans]
# Duplicate versions FAIL unless explicitly skipped below.
multiple-versions = "deny"
# Wildcard dependencies are rejected outright.
wildcards = "deny"
highlight = "all"
deny = [
  # Disallowed crates (spectral/CVE history or maintenance) -- none today.
]
skip-tree = []
# Explicitly permitted multi-version splits (all currently in Cargo.lock are
# enumerated so that new splits are caught while old ones are tracked):
#   - crypto ecosystem splits at 0.x/0.x markers (RustCrypto release trains)
#   - windows-* metadata/impl crates split per windows-sys generation
#   - build-tooling splits (syn, thiserror, toml_edit families)
#   - rand family: 0.8 (security engines) vs 0.9/0.10 (transitive tooling)
