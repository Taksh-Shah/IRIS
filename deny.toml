[licenses]
# MIT/Apache-2.0 are the workspace license (Cargo.toml). The rest are the
# transitive permissive licenses currently present (determined from Cargo.lock
# crate metadata during AC-7 fixture generation).
allow = [
  "MIT",
  "Apache-2.0",
  "ISC",
  "Zlib",
  "BSD-3-Clause",
  "Unicode-3.0",
  "0BSD",
  "BSD-2-Clause",
  "MPL-2.0",
  "WTFPL",
  "CC0-1.0",
]
confidence-threshold = 0.9
# Copyleft licenses fail the gate (EMERG-001 constraint: auditable).
copyleft = "deny"
allow-osi-fsf-free = "unlicensed"
default = "deny"

[target."cfg(windows)"]
licenses.allow = [
  "MIT",
  "Apache-2.0",
  "ISC",
  "Zlib",
  "BSD-3-Clause",
  "Unicode-3.0",
  "0BSD",
  "BSD-2-Clause",
  "MPL-2.0",
  "WTFPL",
  "CC0-1.0",
]

[sources]
# All dependencies must resolve from crates.io; private/git sources fail.
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []