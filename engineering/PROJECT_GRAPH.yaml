    acceptance_criteria:
      - "Desktop app launches and hosts the engine (DesktopEngine constructs MessageEngine + TransportManager with node identity; main runs Tauri Builder + run())"
      - "Send/receive over available transports (loopback SimulatedTransport round-trip: send_message -> engine -> transport -> process_incoming -> delivered -> subscribe_inbox Channel)"
      - "Message history via STORE-001 seam (engine persists through MessageStorage trait, MemoryStorage default; seam wired and verified by engine tests persisting)"
      - "Telemetry visible (get_telemetry returns OBS-001 registry snapshot; UI renders counters)"
      - "Graceful degradation without transport (status reports Unavailable/missing; UI shows offline; sends still enqueue store-carry-forward, not dropped)"
      - "Tests cover 1-5; workspace green; clippy 0 warnings"
