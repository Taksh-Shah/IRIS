  - id: "WIFIDIRECT-001"
    name: "Wi-Fi Direct Transport"
    type: TRANSPORT
    priority: P1
    status: COMPLETE
    description: "Wi-Fi Direct for large file transfer between nearby devices"
    dependencies: ["TRANSPORT-001"]
    platform: ANDROID
    evidence:
      - "docs/transports/WIFI_DIRECT.md (326 lines): Wi-Fi Direct = high-bandwidth data-transfer channel trigged AFTER BLE discovery (BLE is control plane, Wi-Fi Direct is data plane). Capabilities: up to 200 m LOS (30-100 m typical), up to 250 Mbps 802.11n (10-80 Mbps practical), setup 2-15 s (typically 3-8 s), latency 1-5 ms after setup, 2.4/5 GHz, 1 GO + up to 8 clients, battery 50-200 mA HIGH. GO/client asymmetry: GO IP 192.168.49.1 predictable (client DHCP 192.168.49.2-254). Service Discovery (DNS-SD/Bonjour) preferred over device-name filtering. CRITICAL LIMITATION: Wi-Fi Direct discovery/connection does NOT work reliably in background on Android — requires foreground/FGS + wakelock; IRIS triggers WD only when app foreground or FGS with screen on; BLE handles background discovery, WD only for active transfers. iOS: WD NOT available to 3rd-party apps (private API); Apple MCSession = Apple-to-Apple only (Bonjour); iOS<->Android falls back to BLE = known capability gap. Canonical 4-phase BLE-coordination workflow (discovery -> transfer offer via BLE GATT >10 KB -> group formation + transfer -> teardown removeGroup + BLE resumes). Known issues: slow group formation (never for P0/P1), GO election intent bias (fixed infra 14 / battery 7 / low-battery 3), battery scan drain 80-150 mA (no continuous discovery, 30 s window), same-band interference with infra Wi-Fi (setGroupOperatingBand API 30+ hint). Platform matrix: Android 7+ basic P2P, Android 10+ service discovery + persistent GO, iOS No, Linux wpa_supplicant Yes (limited). Decision gates: use when payload >10 KB + Android + foreground + battery>15% + not already in a group; no for iOS/background/P0/P1/battery<15%"
      - "docs/transports/TRANSPORT_ABSTRACTION.md capability matrix row (Wi-Fi Direct): 50-200 m / ~250 Mbps peak / 10-80 Mbps practical / 50-500 ms setup / High battery / None infra / Android background No (wakelock) / iOS No (private API) / P0-P3 (files) best tier"
      - "crates/iris-core/src/transport/manager.rs:460: transport manager test already registers a 'wifi-direct' stub (cost battery 5.0 / 50 MB cap / Connected) proving the TransportManager selection path anticipates Wi-Fi Direct. No production wifi-direct module exists yet (crates/iris-core/src/transport/ has ble/ble_advert/ble_att/internet/manager/simulated/wifiaware/wifiaware_beacon — no wifi_direct.rs)"
