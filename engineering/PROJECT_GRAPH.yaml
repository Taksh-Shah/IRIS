  - id: "SEC-001"
    name: "Security Hardening"
    type: SECURITY
    priority: P0
    status: DESIGNING
    description: "Threat model implementation, DoS resistance, replay protection, Sybil mitigation"
    dependencies: ["CRYPTO-001", "MSG-001", "ROUTE-001"]
    acceptance_criteria:
      - "AC-1: General per-(sender,class) srTCM token-bucket rate limiter (RFC 2697 shape); P0/P1 never dropped by it; overflow silent-drop (no error/NAK); burst+refill+class-isolation tested"
      - "AC-2: Per-sender storage quota + priority-reserved pool (generalizes emergency pool); P0/P1 never evicted by quota; lifetime/TTL ordering tested"
      - "AC-3: Inbound freshness window with per-source skew budget; too-old/too-future rejected; DTN-time/monotonic semantics per RFC 9171 §4.2.7 (no NTP requirement)"
      - "AC-4: Per-sender high-water (ts,seq) for trusted senders: <= high-water replay-dropped, strictly-higher accepted+advances; in-order/out-of-order/duplicate/reboot tested"
      - "AC-5: Cross-reboot persistence: dedup Bloom+LRU snapshot + high-water marks persisted batched crash-safe; mock-restart replay rejected (promotes WP-2 deferral, message_engine/mod.rs:24)"
      - "AC-6: Message-id = >=128-bit SHA-256 truncation over sealed envelope; collision analysis per NIST SP 800-107 documented (self-collision harms only attacker; victim 2nd-preimage infeasible at 128-bit)"
      - "AC-7: Reassembled fragments re-enter same dedup/freshness/high-water pipeline (no replay-after-reassembly gap)"
      - "AC-8: reputation.rs bounded per-peer Bayesian score = local watchdog + verified-second-hand positives-only (CORE) + iTrust-style audits; maps to ROUTING WEIGHT; negative scores never propagate"
      - "AC-9: Reputation never an admission gate: low/missing-reputation relay remains usable; regression test proves no message dropped purely for reputation"
      - "AC-10: Receiver-side 'likely_spam' annotation produced; relay never hard-drops content; P0-P3 disjoint from spam scoring"
      - "AC-11: ACL-1 emergency send authorization data (per-alert-class key/role allowlists); spoofed/revoked/expired/replayed authority rejected (EMERG-001 verify pattern; closes RED-0002/RED-0003/ADR-0011)"
      - "AC-12: Un-armed engine behavior identical (Noop SecurityPolicy == current 431-test suite green); zero new wire fields; zero new crypto crates (cargo tree D6)"
      - "AC-13: Doc reconciliation (C-pattern): DOS_RESISTANCE/SYBIL_RESISTANCE/REPLAY_PROTECTION/THREAT_MODEL/SECURITY_ARCHITECTURE corrected to implemented reality + RES-0018 verdicts (DISC-0013)"
      - "AC-14: Adversarial coverage >=95% of new security module (rate-limit edge, Sybil identity churn, replay-after-reboot, blackhole/gray-hole, forged/replayed authority, msg-id truncation collision, Bloom FP x emergency)"
      - "AC-15: Fuzzing >24h across rate-limit/replay/reputation inputs per safety_critical_additional (or recorded gated deviation with property-based adversarial suite)"
      - "AC-16: Security_Agent review (redteam SEC-RT findings dispositioned); no secrets in logs (CI grep guard); known_limitations recorded (BLE 512B, Sybil-defeatable per-identity limits, sequential reputation convergence)"
