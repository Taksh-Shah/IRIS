      - "Event attribute keys are convention not type-enforced (OBS-RT-01 residual); recommend CI grep guard for payload/signature/secret inside tracing! macros"
      - "MetricsRegistry::reset() is the P5 7-day retention hook; v1 ships no in-crate rotation timer — embedding host must call reset() on flush"
      - "Pre-existing MessageEngine::new tasks.try_lock().unwrap() panic path (OBS-RT-10) out of scope, carried as accepted risk"
      - "No network exporter / OTLP in v1 (by design); telemetry export is a follow-up node"
    evidence:
      - "crates/iris-core/src/observability/mod.rs: 5 unit tests (registry increment/snapshot, reset, delivery-window ratio, priority label, ShortId truncation)"
      - "tests/obs_telemetry.rs: 4 integration tests — shared registry across routing+SCF, engine telemetry counters (expired+delivered), engine accepts injected shared registry (OBS-RT-06), privacy short-id truncation (AC4 P2)"
      - "Red-team review (OBS-RT-01..10): verdict PASS, no CRITICAL/HIGH; P1 payload-free, P2 truncation-by-construction, P3 default-deny, P6 no global state; MEDIUMs fixed in-pass (alloc-free algorithm_label, ShortId no-alloc, scoped lock emits, new_with_telemetry injection)"
      - "docs/implementation/OBS_VERIFICATION.md: acceptance criteria 1-6 all PASS (2026-08-14)"
      - "docs/implementation/OBS_DESIGN.md: authoritative design v1.0"
      - "Workspace 217 green (194 core + 4 obs integration + 8 sim + 10 storage + 1 M3), clippy 0 warnings"
    acceptance_criteria:
      - "Structured telemetry events (key-value, typed, time-stamped) emitted from MSG-001 + ROUTE-001 seams"
      - "Diagnostic log stream with severity levels + message-id correlation (truncated)"
      - "Metrics counters/gauges (delivered, relayed, evicted, storage used, hops) without global state"
      - "Privacy-respecting: no payload/PII in telemetry by default (P1-P3)"
      - "Bounded overhead: no per-message allocation hot path; metrics lock-free AtomicU64 read at flush; no network exporter in v1"
      - "Tests cover 1-5; workspace green; no new clippy warnings"

