      - "Reference-impl pattern (transport pipeline UNDERSTAND->RESEARCH->DESIGN(AC-1..16)->IMPLEMENT->TEST->SECURITY_REVIEW->VERIFY->ACCEPT): INTERNET-001 (internet.rs TCP framing 1 MiB cap pool+backoff) + BLE-001 COMPLETE iter 90 (ble.rs adapter-trait + SimulatedBleAdapter + ble_att.rs segmenter) + WIFIAWARE-001 COMPLETE iter 101 (wifiaware.rs WifiAwareAdapter 12-op FFI trait + SimMesh + wifiaware_beacon.rs 22-byte beacon; verification pipeline + SECURITY_REVIEW + independent verifier pattern). Workspace 552/0/1 clippy 0 baseline"
