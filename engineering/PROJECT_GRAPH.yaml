  - id: "DESKTOP-001"
    name: "Desktop Platform Integration"
    type: PLATFORM
    priority: P1
    status: COMPLETE
    description: "Tauri v2 desktop shell (Windows first, same codebase for macOS/Linux) hosting the iris-core engine in-process. crates/iris-desktop/: build.rs (tauri_build + Windows comctl32 v6 manifest for tests), tauri.conf.json (identifier in.iris.mesh.desktop, frontendDist ../ui, withGlobalTauri true, 900x600), capabilities/default.json (core:default), src/engine_handle.rs (DesktopEngine: TransportManager + loopback SimulatedTransport always + InternetTransport when IRIS_RELAY_ADDR, MessageEngine::new_with_telemetry over MemoryStorage, auto-spawned inbox forwarder -> process_incoming, subscribe_inbox Channel), src/commands.rs (send_message/get_mesh_status/get_telemetry/subscribe_inbox thin #[tauri::command] State<'_, Arc<DesktopEngine>>), src/types.rs (serde DTOs, privacy-truncated ShortId views), src/lib.rs run(), ui/ vanilla no-npm frontend, tests/engine_roundtrip.rs + tests/commands_mock.rs."
