  - id: "ML-001"
    name: "ML Routing Experiments"
    type: EXPERIMENT
    priority: P3
    status: COMPLETE
    description: "L3 ML for delivery probability, gateway prediction. Experimental only."
    dependencies: ["ROUTE-002", "SIM-001"]
    acceptance_criteria:
      - "AC-1: Feature computation deterministic (same seed -> identical FeatureVec sequence), zero runtime cost when disabled"
      - "AC-2: Shadow path byte-identical to L2-only baseline (same seed -> same delivered/relays/avg-hops)"
      - "AC-3: LinearPredictor decision agreement >= 0.70 on community_ferry seed 7, Brier score < 0.30"
      - "AC-4: Ground-truth (GtPredictor) beats static baseline on periodic regime; parity-or-worse on aperiodic (no-help bound)"
      - "AC-5: >= 10 seeds x both regimes reproducible (paired same-seed A/B; anchors exact/deterministic)"
      - "AC-6: cargo test --workspace green + clippy 0 warnings"
      - "AC-7: No new dependencies; L3 output NEVER affects forwarding (shadow-only)"
    evidence:
      - "docs/implementation/ML_DESIGN.md (design, iter 51)"
      - "docs/implementation/ML_VERIFICATION.md v1.0 (VERIFY, iter 53): AC-1..AC-7 PASS with verifier (PASS_WITH_GAPS, 3 doc corrections applied)"
      - "crates/iris-core/src/sim/ml/ (mod/features/predictor/experiment.rs) + tests/ml_experiments.rs"
      - "engineering/memory/records/RED-0002.md (redteam SECURITY_REVIEW PASS; ML-RT-02/03 fixed in-pass)"
    known_limitations:
      - "ML-RT-01: unseeded Uuid::now_v7() — pre-existing sim-wide determinism caveat"
      - "ML-RT-04: unbounded shadow recorder — harness-only"
      - "ML-RT-05/06/07: INFO-level findings (documented in RED-0002)"
      - "Gateway prediction is scenario-bound (documented boundary)"
    stage_note: "COMPLETE (iter 53): RESEARCH (RES-0014) -> DESIGN (ML_DESIGN.md AC-1..7) -> IMPLEMENT+TEST (AC 1-6 PASS, 244 green) -> SECURITY_REVIEW (RED-0002 PASS, ML-RT-02/03 fixed) -> VERIFY (ML_VERIFICATION.md v1.0, verifier PASS_WITH_GAPS -> corrections applied -> ACCEPT). Leaf node — graph stalls on gates after this unless BLK-0002 expansion."

