  - id: "OBS-001"
    name: "Observability System"
    type: OPERATIONS
    priority: P1
    status: COMPLETE
    description: "Structured logging, metrics, diagnostics, telemetry (privacy-respecting). WP-9: crates/iris-core/src/observability/mod.rs (MetricsRegistry injected Arc-backed lock-free AtomicU64 counters — 9 iris.*_total names, snapshot/reset, default-deny unknown-name ignore; 24-event taxonomy constants; ShortId [u8;8] privacy-truncated identifier type); MessageId/PeerId::short() -> ShortId (no-alloc, 8-byte/16-hex by construction); seam instrumentation: message_engine 9 events (created/queued/sent/delivered/acknowledged/expired/delivery_failed/dropped_duplicate/fragments_reassembled) + 6 counters, routing route.decision + route.pruned + decisions counter via allocation-free algorithm_label(), scf buffered/reaped_expired/evicted + evictions counter, gateway adopted/withdrawn/health_transition/selected."
    dependencies: ["MSG-001", "ROUTE-001"]
    known_limitations:
