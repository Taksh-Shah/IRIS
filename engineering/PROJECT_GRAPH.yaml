      - "docs/implementation/DESKTOP_VERIFICATION.md: acceptance criteria 1-6 all PASS (2026-08-14)"
      - "tests/engine_roundtrip.rs: 3 tests — loopback_wire_delivers_from_alice_to_bob (AC2 production path), multiple_messages_arrive_in_order, graceful_degradation_when_transport_down (AC5)"
      - "tests/commands_mock.rs: 3 tests over tauri::test MockRuntime — send_message truncated-id (AC2), mesh_status online/transport (AC4), telemetry typed snapshot (AC4); mock app construction asserts manage()+try_state (AC1)"
      - "crates/iris-desktop/src/{engine_handle,commands,types,lib,main}.rs: DesktopEngine host, 4-command surface, serde DTOs, run()"
      - "docs/implementation/DESKTOP_DESIGN.md: authoritative design v1.0"
